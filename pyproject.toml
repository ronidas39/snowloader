[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "snowloader"
version = "0.3.0"
description = "Comprehensive ServiceNow data loader for AI/LLM pipelines - Incidents, CMDB, KB, Changes, Catalog & more. Works with LangChain & LlamaIndex."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Roni Das", email = "thetotaltechnology@gmail.com"},
]
keywords = [
    "servicenow", "langchain", "llamaindex", "rag", "llm",
    "document-loader", "itsm", "cmdb", "incidents", "ai",
    "data-loader", "knowledge-base", "agentic-ai", "vector-database",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    "requests>=2.28.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
async = ["aiohttp>=3.9.0"]
langchain = ["langchain-core>=0.2.0"]
llamaindex = ["llama-index-core>=0.11.0"]
all = [
    "aiohttp>=3.9.0",
    "langchain-core>=0.2.0",
    "llama-index-core>=0.11.0",
]
dev = [
    # aiohttp is capped for the test environment only, not for users. aiohttp
    # 3.14 changed ClientResponse.__init__ to require stream_writer, and
    # aioresponses (0.7.9, the latest) still builds one without it, so every
    # async test errors on the mock rather than on our code. The async and all
    # extras stay unpinned so installs are free to use 3.14.
    "aiohttp>=3.9.0,<3.14",
    "aioresponses>=0.7.6",
    "pytest>=7.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.0.0",
    "responses>=0.23.0",
    "ruff>=0.4.0",
    "mypy>=1.8.0",
    "types-requests>=2.28.0",
]
docs = [
    "sphinx>=7.0.0",
    "furo>=2024.1.0",
    "sphinx-copybutton>=0.5.0",
    "sphinx-autodoc-typehints>=2.0.0",
    "sphinx-inline-tabs>=2023.4.0",
    "myst-parser>=3.0.0",
]

[project.urls]
Homepage = "https://github.com/ronidas39/snowloader"
Documentation = "https://snowloader.readthedocs.io"
Repository = "https://github.com/ronidas39/snowloader"
Issues = "https://github.com/ronidas39/snowloader/issues"
Changelog = "https://github.com/ronidas39/snowloader/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/snowloader"]

# Curate the sdist explicitly. Without this, hatchling sweeps the whole
# working directory, which on a developer machine means local tooling
# directories and scratch files get published to PyPI. An allow list cannot
# leak something nobody thought about.
[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/docs",
    "/scripts",
    "/README.md",
    "/CHANGELOG.md",
    "/LICENSE",
    "/pyproject.toml",
]
exclude = [
    "/docs/_build",
    "**/__pycache__",
]

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "W"]

[tool.ruff.lint.isort]
known-first-party = ["snowloader"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: tests requiring live ServiceNow instance",
]

[tool.mypy]
# 3.12 rather than our 3.10 floor, because numpy ships stubs written with PEP
# 695 "type" statements and mypy refuses to parse them at 3.10. numpy is not a
# dependency of this package, it arrives through llama-index-core. Our own 3.10
# compatibility is still enforced: ruff runs with target-version py310, and the
# CI matrix runs the whole test suite on a real 3.10 interpreter.
python_version = "3.12"
strict = true
packages = ["snowloader"]
mypy_path = "src"


[tool.coverage.run]
source = ["snowloader"]

[tool.coverage.report]
show_missing = true
fail_under = 80
